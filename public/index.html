<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d19">
  <meta name="description" content="잃어버린 이름을 되찾는 픽셀 액션 로그라이트. 끝없는 보스러쉬에서 성장 재화를 얻고 영혼을 수집하세요.">
  <title>Soul collecter</title>
  <link rel="icon" href="./assets/favicon-48.png">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07060b;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}body{display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}button,input,select{font:inherit}button{cursor:pointer}input{user-select:text}#boot-status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:14px system-ui;color:#c9c1df;background:#07060b;z-index:100;pointer-events:none}#boot-status strong{color:#e7c178;font-size:24px;margin-bottom:14px}#boot-status.error{pointer-events:auto}#boot-status button{padding:10px;background:#342b48;border:1px solid #d7b777;color:#fff}
  </style>
  <script src="./config.js"></script>
  <script type="module">
    const status=document.querySelector('#boot-status');
    import('./src/game.js').then(()=>status.remove()).catch(error=>{console.error(error);status.classList.add('error');status.replaceChildren();const message=document.createElement('p');message.textContent='불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.';const retry=document.createElement('button');retry.textContent='다시 불러오기';retry.onclick=()=>location.reload();status.append(message,retry)});
  </script>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Soul collecter 게임 화면. 이동 A D, 점프 W 또는 스페이스, 공격 J, 대시 Shift, 상호작용 F."></canvas>
  <div id="boot-status" role="status"><strong>Soul collecter</strong><span>기록서를 펼치고 있습니다…</span></div>
  <noscript>게임을 실행하려면 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
